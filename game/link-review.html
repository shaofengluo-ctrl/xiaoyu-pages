<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小羽 | 推断连接验证 (Inferred Link Review)</title>
    <style>
        :root {
            --bg: #0d1117;
            --surface: #161b22;
            --surface2: #1c2128;
            --border: #30363d;
            --text: #c9d1d9;
            --muted: #8b949e;
            --accent: #58a6ff;
            --accent-glow: rgba(88, 166, 255, 0.3);
            --orange: #FF8C00;
            --orange-glow: rgba(255, 140, 0, 0.3);
            --confirm: #3fb950;
            --confirm-glow: rgba(63, 185, 80, 0.4);
            --reject: #f85149;
            --reject-glow: rgba(248, 81, 73, 0.4);
            --retroactive: #a371f7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace;
            min-height: 100vh;
            padding: 0 0 4rem;
        }

        header {
            padding: 2rem 2rem 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-title h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--orange);
            text-shadow: 0 0 12px var(--orange-glow);
        }

        .header-title p {
            font-size: 0.8rem;
            color: var(--muted);
            margin-top: 0.25rem;
        }

        .stats-bar {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
        }

        .stat-item .val {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        .stat-item .lbl {
            font-size: 0.7rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .filter-bar {
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border);
        }

        .filter-bar label {
            font-size: 0.8rem;
            color: var(--muted);
        }

        .filter-bar select,
        .filter-bar input[type=range] {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            padding: 0.3rem 0.6rem;
            font-size: 0.8rem;
        }

        #quality-val {
            font-size: 0.8rem;
            color: var(--orange);
            min-width: 3ch;
        }

        .card-grid {
            padding: 1.5rem 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1rem;
        }

        .link-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.2rem;
            position: relative;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .link-card:hover {
            border-color: var(--orange);
            box-shadow: 0 0 12px var(--orange-glow);
        }

        .link-card.confirmed {
            border-color: var(--confirm);
            opacity: 0.6;
        }

        .link-card.rejected {
            border-color: var(--reject);
            opacity: 0.4;
        }

        .link-card.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .edge-path {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }

        .node-chip {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.3rem 0.7rem;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--accent);
            max-width: 140px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: default;
        }

        .node-chip:hover {
            color: #fff;
            border-color: var(--accent);
        }

        .relation-chip {
            font-size: 0.72rem;
            color: var(--orange);
            padding: 0.2rem 0.5rem;
            border: 1px solid var(--orange);
            border-radius: 4px;
            white-space: nowrap;
        }

        .arrow {
            color: var(--muted);
            font-size: 1rem;
            flex-shrink: 0;
        }

        .desc-text {
            font-size: 0.78rem;
            color: var(--muted);
            margin-bottom: 1rem;
            line-height: 1.5;
            min-height: 1.2em;
        }

        .meta-row {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .badge {
            font-size: 0.7rem;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-weight: 600;
        }

        .badge-quality-high { background: rgba(63,185,80,0.15); color: var(--confirm); border: 1px solid rgba(63,185,80,0.3); }
        .badge-quality-moderate { background: rgba(255,140,0,0.12); color: var(--orange); border: 1px solid rgba(255,140,0,0.3); }
        .badge-quality-low { background: rgba(248,81,73,0.12); color: var(--reject); border: 1px solid rgba(248,81,73,0.3); }

        .score-bar {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .score-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.4s ease;
        }

        .btn-row {
            display: flex;
            gap: 0.6rem;
        }

        .btn-confirm, .btn-reject {
            flex: 1;
            padding: 0.55rem 0;
            border: none;
            border-radius: 7px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        .btn-confirm {
            background: rgba(63,185,80,0.15);
            color: var(--confirm);
            border: 1px solid rgba(63,185,80,0.4);
        }

        .btn-confirm:hover {
            background: rgba(63,185,80,0.3);
            box-shadow: 0 0 10px var(--confirm-glow);
            transform: translateY(-1px);
        }

        .btn-reject {
            background: rgba(248,81,73,0.12);
            color: var(--reject);
            border: 1px solid rgba(248,81,73,0.3);
        }

        .btn-reject:hover {
            background: rgba(248,81,73,0.25);
            box-shadow: 0 0 10px var(--reject-glow);
            transform: translateY(-1px);
        }

        .verdict-overlay {
            position: absolute;
            inset: 0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .verdict-overlay.show {
            opacity: 1;
        }

        .verdict-overlay.confirmed-overlay {
            background: rgba(63,185,80,0.08);
        }

        .verdict-overlay.rejected-overlay {
            background: rgba(248,81,73,0.08);
        }

        @keyframes skullFloat {
            0%   { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
            30%  { transform: translateY(-12px) scale(1.3) rotate(-8deg); opacity: 0.95; }
            60%  { transform: translateY(-24px) scale(1.1) rotate(6deg); opacity: 0.7; }
            100% { transform: translateY(-48px) scale(0.6) rotate(-15deg); opacity: 0; }
        }
        @keyframes cardDeathShake {
            0%,100% { transform: translateX(0); }
            20%     { transform: translateX(-4px) rotate(-1deg); }
            40%     { transform: translateX(4px) rotate(1deg); }
            60%     { transform: translateX(-3px); }
            80%     { transform: translateX(3px); }
        }
        @keyframes cardFade {
            0%   { opacity: 1; filter: saturate(1); }
            100% { opacity: 0.35; filter: saturate(0) brightness(0.5); }
        }
        .skull-float {
            position: fixed;
            font-size: 2rem;
            pointer-events: none;
            z-index: 9999;
            animation: skullFloat 1s ease-out forwards;
        }
        .link-card.death-shake {
            animation: cardDeathShake 0.4s ease-in-out, cardFade 0.8s 0.4s ease-out forwards;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            padding: 1.5rem 2rem;
        }

        .btn-page {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            padding: 0.4rem 1rem;
            cursor: pointer;
            font-size: 0.85rem;
            transition: border-color 0.2s;
        }

        .btn-page:hover:not(:disabled) {
            border-color: var(--orange);
            color: var(--orange);
        }

        .btn-page:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .page-info {
            font-size: 0.85rem;
            color: var(--muted);
        }

        #toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.7rem 1.4rem;
            font-size: 0.85rem;
            transition: transform 0.3s ease;
            z-index: 999;
            pointer-events: none;
            white-space: nowrap;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }

        #toast.toast-confirm { border-color: var(--confirm); color: var(--confirm); }
        #toast.toast-reject { border-color: var(--reject); color: var(--reject); }
        #toast.toast-error { border-color: var(--reject); color: var(--reject); }

        .empty-state {
            text-align: center;
            padding: 5rem 2rem;
            color: var(--muted);
        }

        .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }

        .confetti-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 998;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .link-card { animation: fadeIn 0.25s ease forwards; }
    </style>
</head>
<body>

<canvas class="confetti-canvas" id="confettiCanvas"></canvas>

<header>
    <div class="header-title">
        <h1>🔗 推断连接验证台</h1>
        <p>Inferred Link Review — Phase 110 · 人图共进化 · 机器推断等待人类裁决</p>
    </div>
    <div class="stats-bar">
        <div class="stat-item">
            <div class="val" id="stat-total">—</div>
            <div class="lbl">待审</div>
        </div>
        <div class="stat-item">
            <div class="val" id="stat-confirmed" style="color:var(--confirm)">0</div>
            <div class="lbl">已确认</div>
        </div>
        <div class="stat-item">
            <div class="val" id="stat-rejected" style="color:var(--reject)">0</div>
            <div class="lbl">已否定</div>
        </div>
        <div class="stat-item" title="人类历史累计贡献到图谱的连接总数">
            <div class="val" id="stat-human-total" style="color:#a371f7">—</div>
            <div class="lbl">🧬 人类贡献</div>
        </div>
    </div>
</header>

<div class="filter-bar">
    <label>质量筛选 ≥</label>
    <input type="range" id="quality-filter" min="0" max="1" step="0.05" value="0">
    <span id="quality-val">0.00</span>
    <label style="margin-left:1rem">排序</label>
    <select id="sort-select">
        <option value="asc">质量分 ↑ 低→高</option>
        <option value="desc">质量分 ↓ 高→低</option>
    </select>
</div>

<div class="card-grid" id="cardGrid"></div>

<div class="pagination" id="pagination">
    <button class="btn-page" id="btnPrev" disabled>← 上一页</button>
    <span class="page-info" id="pageInfo">—</span>
    <button class="btn-page" id="btnNext" disabled>下一页 →</button>
</div>

<div id="toast"></div>

<script>
const API = 'http://127.0.0.1:5097';
let state = {
    page: 1,
    pageSize: 12,
    total: 0,
    pages: 1,
    items: [],
    confirmed: 0,
    rejected: 0,
    qualityFilter: 0,
    sortOrder: 'asc',
};

const grid = document.getElementById('cardGrid');
const statTotal = document.getElementById('stat-total');
const statConfirmed = document.getElementById('stat-confirmed');
const statRejected = document.getElementById('stat-rejected');
const statHumanTotal = document.getElementById('stat-human-total');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const pageInfo = document.getElementById('pageInfo');
const qualityFilter = document.getElementById('quality-filter');
const qualityVal = document.getElementById('quality-val');
const sortSelect = document.getElementById('sort-select');
const toast = document.getElementById('toast');
const canvas = document.getElementById('confettiCanvas');
const ctx = canvas.getContext('2d');

let toastTimer = null;
let confettiParticles = [];
let confettiFrame = null;

function showToast(msg, type) {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.className = `show toast-${type}`;
    toastTimer = setTimeout(() => { toast.className = ''; }, 2800);
}

function qualityLabel(score) {
    if (score == null) return { label: '?', cls: 'badge-quality-moderate' };
    if (score >= 0.5) return { label: `HIGH ${score.toFixed(2)}`, cls: 'badge-quality-high' };
    if (score >= 0.35) return { label: `MED ${score.toFixed(2)}`, cls: 'badge-quality-moderate' };
    return { label: `LOW ${score.toFixed(2)}`, cls: 'badge-quality-low' };
}

function scoreColor(score) {
    if (score == null) return '#8b949e';
    if (score >= 0.5) return '#3fb950';
    if (score >= 0.35) return '#FF8C00';
    return '#f85149';
}

function renderCard(item) {
    const q = qualityLabel(item.quality_score);
    const fillPct = item.quality_score != null ? Math.round(item.quality_score * 100) : 50;
    const fromLabel = item.from.label || item.from.id;
    const toLabel = item.to.label || item.to.id;
    const desc = item.description || '';

    const card = document.createElement('div');
    card.className = 'link-card';
    card.dataset.edgeId = item.edge_id;
    card.dataset.fromId = item.from.id;
    card.dataset.toId = item.to.id;

    card.innerHTML = `
        <div class="edge-path">
            <div class="node-chip" title="${item.from.id}">${fromLabel}</div>
            <div class="arrow">→</div>
            <div class="relation-chip">${item.relation}</div>
            <div class="arrow">→</div>
            <div class="node-chip" title="${item.to.id}">${toLabel}</div>
        </div>
        ${desc ? `<div class="desc-text">${desc}</div>` : '<div class="desc-text" style="font-style:italic">（无描述）</div>'}
        <div class="meta-row">
            <span class="badge ${q.cls}">${q.label}</span>
            ${item.quality === 'low_confidence' ? '<span class="badge badge-quality-low">⚠ low_conf</span>' : ''}
            ${item.created_at ? `<span class="badge" style="background:rgba(88,166,255,0.1);color:#58a6ff;border:1px solid rgba(88,166,255,0.25)">${item.created_at.slice(0,10)}</span>` : ''}
        </div>
        <div class="score-bar">
            <div class="score-fill" style="width:${fillPct}%;background:${scoreColor(item.quality_score)}"></div>
        </div>
        <div class="btn-row">
            <button class="btn-confirm" onclick="verdict('${item.edge_id}', 'confirm', this)">✅ 确认升级</button>
            <button class="btn-reject" onclick="verdict('${item.edge_id}', 'reject', this)">❌ 否定消亡</button>
        </div>
        <div id="graph-jump-${CSS.escape(item.edge_id)}" style="display:none; margin-top:8px; text-align:center;">
            <a id="graph-link-${CSS.escape(item.edge_id)}" href="#" target="_blank"
               style="display:inline-block; padding:5px 14px; background:rgba(0,255,180,0.12); border:1px solid rgba(0,255,180,0.4); color:#00FFCC; border-radius:4px; font-size:0.72rem; text-decoration:none; cursor:pointer;">
                🕸️ 在图谱中查看此连接
            </a>
        </div>
        <div class="verdict-overlay" id="overlay-${CSS.escape(item.edge_id)}"></div>
    `;
    return card;
}

async function verdict(edgeId, v, btn) {
    const card = btn.closest('.link-card');
    card.classList.add('loading');

    try {
        const res = await fetch(`${API}/validate-inferred-link`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ edge_id: edgeId, verdict: v }),
        });
        if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.detail || res.statusText);
        }
        const data = await res.json();

        if (v === 'confirm') {
            state.confirmed++;
            statConfirmed.textContent = state.confirmed;
            card.classList.add('confirmed');
            const overlay = document.getElementById(`overlay-${CSS.escape(edgeId)}`);
            if (overlay) {
                overlay.textContent = '✨';
                overlay.classList.add('show', 'confirmed-overlay');
            }
            showToast(`✅ 已升级为 retroactive_link`, 'confirm');
            launchConfetti(card);

            const fromId = card.dataset.fromId;
            const toId = card.dataset.toId;
            const jumpDiv = document.getElementById(`graph-jump-${CSS.escape(edgeId)}`);
            const jumpLink = document.getElementById(`graph-link-${CSS.escape(edgeId)}`);
            if (jumpDiv && jumpLink && fromId) {
                jumpLink.href = `../graph/graph-viewer-3d.html?node=${encodeURIComponent(fromId)}&verdict_edge=${encodeURIComponent(edgeId)}`;
                jumpDiv.style.display = 'block';
            }

            fetchHumanContributions();

            try {
                localStorage.setItem('xiaoyu_verdict_event', JSON.stringify({
                    type: 'verdict_confirmed',
                    edgeId,
                    fromId,
                    toId,
                    ts: Date.now()
                }));
                localStorage.setItem('heat_update', String(Date.now()));
            } catch (_) {}
        } else {
            state.rejected++;
            statRejected.textContent = state.rejected;
            card.classList.add('rejected');
            const overlay = document.getElementById(`overlay-${CSS.escape(edgeId)}`);
            if (overlay) {
                overlay.textContent = '💀';
                overlay.classList.add('show', 'rejected-overlay');
            }
            launchSkullDeath(card);
            showToast(`☠️ 已否定 · 骷髅入坟 · 等待衰减`, 'reject');
        }

        card.querySelectorAll('button').forEach(b => b.disabled = true);

    } catch (e) {
        card.classList.remove('loading');
        showToast(`错误: ${e.message}`, 'error');
    }
}

async function loadPage() {
    grid.innerHTML = '';
    try {
        const params = new URLSearchParams({ page: state.page, page_size: state.pageSize });
        const res = await fetch(`${API}/inferred-links?${params}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        state.total = data.total;
        state.pages = data.pages;

        let items = data.items || [];

        if (state.qualityFilter > 0) {
            items = items.filter(i => (i.quality_score || 0) >= state.qualityFilter);
        }

        if (state.sortOrder === 'desc') {
            items = items.slice().sort((a, b) => (b.quality_score || 0) - (a.quality_score || 0));
        } else {
            items = items.slice().sort((a, b) => (a.quality_score || 0) - (b.quality_score || 0));
        }

        statTotal.textContent = state.total;

        if (items.length === 0) {
            grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
                <div class="icon">🎉</div>
                <p>当前页无待审推断连接</p>
            </div>`;
        } else {
            items.forEach(item => grid.appendChild(renderCard(item)));
        }

        pageInfo.textContent = `第 ${state.page} / ${state.pages} 页 · 共 ${state.total} 条`;
        btnPrev.disabled = state.page <= 1;
        btnNext.disabled = state.page >= state.pages;

    } catch (e) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
            <div class="icon">⚠️</div>
            <p>无法连接 memory_server（${API}）</p>
            <p style="font-size:0.75rem;margin-top:0.5rem">${e.message}</p>
        </div>`;
        showToast(`连接失败: ${e.message}`, 'error');
    }
}

btnPrev.addEventListener('click', () => { state.page--; loadPage(); });
btnNext.addEventListener('click', () => { state.page++; loadPage(); });

qualityFilter.addEventListener('input', () => {
    state.qualityFilter = parseFloat(qualityFilter.value);
    qualityVal.textContent = state.qualityFilter.toFixed(2);
    state.page = 1;
    loadPage();
});

sortSelect.addEventListener('change', () => {
    state.sortOrder = sortSelect.value;
    loadPage();
});

function launchSkullDeath(card) {
    const rect = card.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 3;

    for (let i = 0; i < 5; i++) {
        const skull = document.createElement('div');
        skull.className = 'skull-float';
        skull.textContent = ['💀', '☠️', '💀', '🩸', '💀'][i];
        skull.style.left = (cx + (Math.random() - 0.5) * 80) + 'px';
        skull.style.top = cy + 'px';
        skull.style.animationDelay = (i * 0.1) + 's';
        document.body.appendChild(skull);
        setTimeout(() => skull.remove(), 1200 + i * 100);
    }

    card.classList.add('death-shake');
    setTimeout(() => card.classList.remove('death-shake'), 1200);
}

async function fetchHumanContributions() {
    try {
        const res = await fetch(`${API}/human-signals`);
        if (!res.ok) return;
        const data = await res.json();
        const total = data.total_confirmed || 0;
        statHumanTotal.textContent = total;
        if (total > 0) {
            statHumanTotal.style.color = '#a371f7';
            statHumanTotal.title = `已有 ${total} 条人类确认连接进入知识图谱`;
        }
    } catch (_) {
        statHumanTotal.textContent = '—';
    }
}

function launchConfetti(card) {
    const rect = card.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const colors = ['#3fb950','#58a6ff','#a371f7','#FF8C00','#f0e68c'];
    for (let i = 0; i < 40; i++) {
        confettiParticles.push({
            x: cx, y: cy,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.8) * 10,
            life: 1,
            color: colors[Math.floor(Math.random() * colors.length)],
            size: Math.random() * 6 + 3,
        });
    }

    if (!confettiFrame) animateConfetti();
}

function animateConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    confettiParticles = confettiParticles.filter(p => p.life > 0);
    confettiParticles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.3;
        p.life -= 0.025;
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    ctx.globalAlpha = 1;

    if (confettiParticles.length > 0) {
        confettiFrame = requestAnimationFrame(animateConfetti);
    } else {
        confettiFrame = null;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
}

loadPage();
fetchHumanContributions();
</script>
