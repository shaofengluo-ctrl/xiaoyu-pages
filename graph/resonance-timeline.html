<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双重共鸣时间轴 · Resonance Timeline Gallery</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #08080f; color: #e0e0ff; font-family: 'Courier New', monospace; min-height: 100vh; overflow-x: hidden; }
  header { padding: 16px 28px 12px; border-bottom: 1px solid #1a1a3a; display: flex; align-items: center; justify-content: space-between; }
  header .left { display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 1.25rem; color: #c084fc; letter-spacing: 2px; text-shadow: 0 0 20px #c084fc55; }
  header .subtitle { font-size: 0.72rem; color: #5a5a8a; }
  .live-badge { font-size: 0.65rem; background: #1a0a2e; border: 1px solid #7c3aed44; color: #a855f7; padding: 3px 10px; border-radius: 12px; letter-spacing: 1px; }
  .live-badge::before { content: '⬤ '; color: #a855f7; animation: blink 2s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  .stats-bar { display: flex; gap: 24px; padding: 8px 28px; background: #0a0a18; border-bottom: 1px solid #1a1a3a; font-size: 0.72rem; color: #666; flex-wrap: wrap; }
  .stats-bar .stat b { color: #c084fc; }
  .stats-bar .stat.heat b { color: #f97316; }
  .stats-bar .stat.boost b { color: #38bdf8; }
  .stats-bar .stat.resonance b { color: #e879f9; }

  #main { display: flex; height: calc(100vh - 100px); }

  #sidebar { width: 220px; min-width: 180px; border-right: 1px solid #1a1a3a; overflow-y: auto; padding: 14px 0; flex-shrink: 0; scrollbar-width: thin; scrollbar-color: #2a2a4a transparent; }
  #sidebar::-webkit-scrollbar { width: 4px; }
  #sidebar::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 2px; }
  .sidebar-title { font-size: 0.65rem; color: #4a4a7a; letter-spacing: 2px; padding: 0 14px 10px; text-transform: uppercase; }
  .rank-item { padding: 9px 14px; cursor: pointer; border-left: 3px solid transparent; transition: all 0.15s; display: flex; align-items: center; gap: 8px; }
  .rank-item:hover, .rank-item.active { background: #14142a; border-left-color: #c084fc; }
  .rank-num { font-size: 0.65rem; color: #4a4a7a; width: 16px; text-align: center; flex-shrink: 0; }
  .rank-label { font-size: 0.72rem; color: #8888bb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .rank-item.active .rank-label { color: #c084fc; }
  .rank-count { font-size: 0.65rem; color: #6b21a8; background: #1a0a2e; padding: 1px 6px; border-radius: 8px; flex-shrink: 0; }

  #chart-area { flex: 1; overflow: hidden; position: relative; display: flex; flex-direction: column; }
  #chart-header { padding: 10px 20px 6px; display: flex; gap: 16px; align-items: center; border-bottom: 1px solid #12122a; flex-shrink: 0; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.68rem; color: #555; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  #timeline-svg { flex: 1; width: 100%; overflow: visible; }

  #detail-panel { width: 260px; min-width: 220px; border-left: 1px solid #1a1a3a; overflow-y: auto; padding: 14px; flex-shrink: 0; scrollbar-width: thin; scrollbar-color: #2a2a4a transparent; }
  #detail-panel::-webkit-scrollbar { width: 4px; }
  #detail-panel::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 2px; }
  .detail-title { font-size: 0.65rem; color: #4a4a7a; letter-spacing: 2px; margin-bottom: 12px; text-transform: uppercase; }
  .detail-placeholder { font-size: 0.72rem; color: #3a3a6a; line-height: 1.6; padding: 20px 0; text-align: center; }

  .event-card { background: #10101e; border: 1px solid #1e1e40; border-radius: 8px; padding: 12px; margin-bottom: 12px; cursor: pointer; transition: border-color 0.2s; }
  .event-card:hover, .event-card.selected { border-color: #c084fc55; }
  .event-card.selected { background: #16162a; border-color: #c084fc; }
  .ec-node { font-size: 0.82rem; color: #e879f9; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ec-time { font-size: 0.65rem; color: #4a4a7a; margin-bottom: 8px; }
  .ec-metrics { display: flex; gap: 8px; flex-wrap: wrap; }
  .ec-metric { font-size: 0.65rem; padding: 2px 8px; border-radius: 10px; }
  .ec-metric.heat { background: #2a1500; color: #f97316; border: 1px solid #7c2d0055; }
  .ec-metric.boost { background: #001a2a; color: #38bdf8; border: 1px solid #0369a155; }
  .ec-metric.intensity { background: #1a002a; color: #c084fc; border: 1px solid #7c3aed55; }

  #empty-state { display: none; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 16px; color: #3a3a6a; }
  #empty-state .empty-icon { font-size: 3rem; opacity: 0.4; }
  #empty-state .empty-text { font-size: 0.82rem; text-align: center; line-height: 1.8; }
  #empty-state .empty-hint { font-size: 0.7rem; color: #2a2a5a; background: #0d0d1e; border: 1px solid #1a1a3a; border-radius: 8px; padding: 12px 20px; text-align: center; line-height: 1.8; max-width: 400px; }

  #tooltip { position: fixed; background: rgba(10,8,25,0.96); border: 1px solid #c084fc55; border-radius: 8px; padding: 10px 14px; font-size: 0.72rem; color: #e0e0ff; pointer-events: none; z-index: 9999; max-width: 260px; line-height: 1.7; display: none; backdrop-filter: blur(6px); }
  #tooltip .tt-node { color: #e879f9; font-weight: bold; margin-bottom: 4px; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: #1e1e3a; border-radius: 2px; }

  @keyframes pulse-ring {
    0% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.5); opacity: 0.2; }
    100% { transform: scale(2); opacity: 0; }
  }
</style>
</head>
<body>

<header>
  <div class="left">
    <h1>⚡ RESONANCE TIMELINE</h1>
    <div class="subtitle">双重共鸣画廊 · 人机交汇历史</div>
  </div>
  <div class="live-badge">LIVE</div>
</header>

<div class="stats-bar" id="stats-bar">
  <span class="stat">EVENTS <b id="stat-total">—</b></span>
  <span class="stat resonance">UNIQUE NODES <b id="stat-nodes">—</b></span>
  <span class="stat heat">AVG HEAT <b id="stat-heat">—</b></span>
  <span class="stat boost">AVG BOOST <b id="stat-boost">—</b></span>
  <span class="stat">LAST EVENT <b id="stat-last">—</b></span>
  <span class="stat" style="margin-left:auto; color:#3a3a6a">↻ 90s auto-refresh</span>
</div>

<div id="main">
  <div id="sidebar">
    <div class="sidebar-title">Top Nodes</div>
    <div id="rank-list"></div>
  </div>

  <div id="chart-area">
    <div id="chart-header">
      <div class="legend-item">
        <div class="legend-dot" style="background:#e879f9; box-shadow:0 0 6px #e879f9aa"></div>
        <span>双重共鸣事件</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#f97316; opacity:0.7"></div>
        <span>高热度 (heat ≥ 0.7)</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#38bdf8; opacity:0.7"></div>
        <span>高激活 (boost ≥ 1.0)</span>
      </div>
      <div class="legend-item" style="margin-left:auto">
        <span style="color:#3a3a6a;font-size:0.65rem">气泡大小 = 综合强度</span>
      </div>
    </div>
    <svg id="timeline-svg"></svg>
    <div id="empty-state">
      <div class="empty-icon">⚡</div>
      <div class="empty-text">暂无双重共鸣事件<br>等待人类凝视 × 洞见激活的第一次交汇…</div>
      <div class="empty-hint" id="candidate-hint">加载中…</div>
    </div>
  </div>

  <div id="detail-panel">
    <div class="detail-title">Event Detail</div>
    <div id="detail-content">
      <div class="detail-placeholder">点击时间轴上的气泡<br>查看事件详情</div>
    </div>
  </div>
</div>

<div id="tooltip"></div>

<script src="resonance-timeline.js"></script>
</body>
</html>
