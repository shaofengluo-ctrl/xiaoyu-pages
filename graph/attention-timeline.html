<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 Attention Timeline — 注意力时间轴</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050a0f;
    color: #c0d8e8;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .header {
    padding: 20px 32px 12px;
    border-bottom: 1px solid rgba(0,180,255,0.15);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header h1 {
    font-size: 1.1rem;
    letter-spacing: 3px;
    color: #44aaff;
    text-transform: uppercase;
  }
  .header .subtitle {
    font-size: 0.6rem;
    color: rgba(0,180,255,0.4);
    letter-spacing: 2px;
  }
  .stats-row {
    display: flex;
    gap: 24px;
    padding: 12px 32px;
    border-bottom: 1px solid rgba(0,180,255,0.08);
    flex-wrap: wrap;
  }
  .stat-item {
    font-size: 0.58rem;
    color: rgba(0,180,255,0.5);
    letter-spacing: 1px;
  }
  .stat-item span { color: #44aaff; font-weight: bold; }

  .layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    height: calc(100vh - 110px);
    overflow: hidden;
  }

  /* Left sidebar */
  .sidebar {
    border-right: 1px solid rgba(0,180,255,0.1);
    overflow-y: auto;
    padding: 16px;
  }
  .sidebar::-webkit-scrollbar { width: 3px; }
  .sidebar::-webkit-scrollbar-thumb { background: rgba(0,180,255,0.2); border-radius: 2px; }

  .section-title {
    font-size: 0.55rem;
    letter-spacing: 2px;
    color: rgba(0,180,255,0.4);
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  .node-rank-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 8px;
    margin-bottom: 3px;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.2s;
    border: 1px solid transparent;
  }
  .node-rank-item:hover { background: rgba(0,180,255,0.08); border-color: rgba(0,180,255,0.2); }
  .node-rank-item.active { background: rgba(0,180,255,0.12); border-color: rgba(0,180,255,0.3); }
  .node-rank-label { font-size: 0.6rem; color: #88ccff; }
  .node-rank-count {
    font-size: 0.55rem;
    color: rgba(0,180,255,0.5);
    background: rgba(0,180,255,0.08);
    padding: 1px 6px;
    border-radius: 8px;
  }

  .trend-section { margin-top: 20px; }
  .trend-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.55rem;
    letter-spacing: 1px;
    padding: 3px 8px;
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .trend-rising { background: rgba(0,255,100,0.08); color: #00ff64; border: 1px solid rgba(0,255,100,0.2); }
  .trend-fading { background: rgba(255,80,80,0.08); color: #ff5050; border: 1px solid rgba(255,80,80,0.2); }
  .trend-stable { background: rgba(0,180,255,0.08); color: #44aaff; border: 1px solid rgba(0,180,255,0.2); }

  .trend-node {
    font-size: 0.58rem;
    padding: 3px 8px;
    margin-bottom: 3px;
    border-radius: 3px;
    color: rgba(200,230,240,0.7);
  }

  /* Main timeline area */
  .main-area {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .timeline-controls {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    border-bottom: 1px solid rgba(0,180,255,0.08);
    flex-wrap: wrap;
    align-items: center;
  }
  .ctrl-btn {
    font-size: 0.55rem;
    padding: 4px 10px;
    background: rgba(0,180,255,0.06);
    border: 1px solid rgba(0,180,255,0.2);
    border-radius: 12px;
    color: rgba(0,180,255,0.7);
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
  }
  .ctrl-btn:hover { background: rgba(0,180,255,0.14); color: #44aaff; }
  .ctrl-btn.active { background: rgba(0,180,255,0.18); color: #44aaff; border-color: rgba(0,180,255,0.5); }

  .timeline-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }
  .timeline-scroll::-webkit-scrollbar { width: 3px; }
  .timeline-scroll::-webkit-scrollbar-thumb { background: rgba(0,180,255,0.15); border-radius: 2px; }

  /* Timeline strip chart */
  #timeline-canvas-wrap {
    width: 100%;
    background: rgba(0,15,25,0.6);
    border: 1px solid rgba(0,180,255,0.1);
    border-radius: 6px;
    padding: 16px;
    margin-bottom: 16px;
  }
  #timeline-canvas { width: 100%; }

  .snap-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 8px;
  }

  .snap-card {
    padding: 8px 10px;
    background: rgba(0,15,25,0.7);
    border: 1px solid rgba(0,180,255,0.1);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .snap-card:hover { border-color: rgba(0,180,255,0.3); background: rgba(0,30,50,0.7); }
  .snap-card.highlighted { border-color: rgba(0,255,180,0.4); background: rgba(0,40,35,0.7); }

  .snap-time {
    font-size: 0.52rem;
    color: rgba(0,180,255,0.4);
    margin-bottom: 5px;
  }
  .snap-top-node {
    font-size: 0.65rem;
    color: #88ddff;
    font-weight: bold;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .snap-nodes {
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
  }
  .snap-node-tag {
    font-size: 0.48rem;
    padding: 1px 5px;
    background: rgba(0,180,255,0.07);
    border: 1px solid rgba(0,180,255,0.15);
    border-radius: 8px;
    color: rgba(100,180,220,0.7);
    white-space: nowrap;
    max-width: 80px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .snap-heat-bar {
    height: 2px;
    background: linear-gradient(to right, rgba(0,180,255,0.3), rgba(0,255,180,0.6));
    border-radius: 1px;
    margin-top: 5px;
  }
  .snap-meta {
    display: flex;
    justify-content: space-between;
    margin-top: 4px;
  }
  .snap-signals {
    font-size: 0.5rem;
    color: rgba(100,180,200,0.4);
  }
  .snap-dual {
    font-size: 0.5rem;
    color: rgba(255,140,0,0.5);
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: rgba(0,180,255,0.3);
    font-size: 0.65rem;
    letter-spacing: 1px;
  }
  .empty-state .big { font-size: 2rem; margin-bottom: 12px; }

  .loading { color: rgba(0,180,255,0.3); font-size: 0.6rem; text-align: center; padding: 40px; letter-spacing: 2px; }

  .filter-input {
    background: rgba(0,15,25,0.8);
    border: 1px solid rgba(0,180,255,0.2);
    border-radius: 4px;
    color: #88ccff;
    padding: 4px 10px;
    font-size: 0.55rem;
    font-family: 'Courier New', monospace;
    outline: none;
    width: 160px;
  }
  .filter-input:focus { border-color: rgba(0,180,255,0.5); }
  .filter-input::placeholder { color: rgba(0,180,255,0.25); }

  .day-divider {
    font-size: 0.5rem;
    letter-spacing: 2px;
    color: rgba(0,180,255,0.25);
    text-transform: uppercase;
    padding: 8px 0 4px;
    border-bottom: 1px solid rgba(0,180,255,0.06);
    margin-bottom: 8px;
  }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>🧠 Attention Timeline</h1>
    <div class="subtitle">Human gaze × time — where has the eye lingered?</div>
  </div>
</div>

<div class="stats-row" id="stats-row">
  <div class="stat-item">Total visits: <span id="stat-visits">—</span></div>
  <div class="stat-item">Snapshots: <span id="stat-snaps">—</span></div>
  <div class="stat-item">Most visited: <span id="stat-most">—</span></div>
  <div class="stat-item">Peak hour: <span id="stat-hour">—</span></div>
  <div class="stat-item">Trend: <span id="stat-trend">—</span></div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="section-title">📊 Node Rankings</div>
    <div id="node-rankings">
      <div class="loading">loading...</div>
    </div>

    <div class="trend-section">
      <div class="section-title" style="margin-top:16px;">📈 Attention Drift</div>
      <div id="trend-rising-section" style="margin-bottom:10px;"></div>
      <div id="trend-fading-section"></div>
    </div>
  </div>

  <div class="main-area">
    <div class="timeline-controls">
      <button class="ctrl-btn active" onclick="setView('cards')" id="btn-cards">CARDS</button>
      <button class="ctrl-btn" onclick="setView('chart')" id="btn-chart">CHART</button>
      <input class="filter-input" id="filter-node" placeholder="filter by node..." oninput="filterByNode(this.value)">
      <div style="flex:1"></div>
      <div id="count-label" style="font-size:0.52rem; color:rgba(0,180,255,0.3); letter-spacing:1px;"></div>
    </div>
    <div class="timeline-scroll" id="timeline-scroll">
      <div class="loading">Loading attention history...</div>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:5097';
let allSnapshots = [];
let currentFilter = '';
let currentView = 'cards';
let activeNodeFilter = null;

async function loadData() {
  try {
    const [histRes, diffRes] = await Promise.all([
      fetch(`${API}/heatmap-history?limit=200`),
      fetch(`${API}/attention-diff?limit=48`)
    ]);
    const hist = await histRes.json();
    const diff = await diffRes.json();

    allSnapshots = hist.snapshots || [];

    document.getElementById('stat-visits').textContent = hist.total_visits || 0;
    document.getElementById('stat-snaps').textContent = hist.total || 0;

    const pat = hist.attention_pattern || {};
    const most = pat.most_visited_node || {};
    document.getElementById('stat-most').textContent = most.label && most.label !== '—'
      ? `${most.label} (×${most.visit_count})`
      : '—';
    document.getElementById('stat-hour').textContent = pat.peak_hour && pat.peak_hour !== '—'
      ? `${pat.peak_hour}:00`
      : '—';

    const trendEl = document.getElementById('stat-trend');
    const trend = diff.trend || 'unknown';
    const trendColors = { rising: '#00ff64', shifting: '#ffaa44', stable: '#44aaff', insufficient_data: 'rgba(0,180,255,0.3)' };
    trendEl.style.color = trendColors[trend] || '#88ccff';
    trendEl.textContent = trend;

    renderNodeRankings(pat.node_rankings || []);
    renderTrendSections(diff);
    renderView();

  } catch (e) {
    document.getElementById('timeline-scroll').innerHTML = `<div class="empty-state"><div class="big">📡</div>Memory server unreachable<br><small>Start server: pm2 restart xiaoyu-memory-server</small></div>`;
  }
}

function renderNodeRankings(rankings) {
  const el = document.getElementById('node-rankings');
  if (!rankings.length) { el.innerHTML = '<div style="font-size:0.55rem;color:rgba(0,180,255,0.25);">No data yet — visit the graph first</div>'; return; }
  el.innerHTML = rankings.map((r, i) => `
    <div class="node-rank-item ${activeNodeFilter === r.label ? 'active' : ''}" onclick="toggleNodeFilter('${r.label.replace(/'/g, "\\'")}')">
      <span class="node-rank-label">${i + 1}. ${r.label}</span>
      <span class="node-rank-count">×${r.count}</span>
    </div>
  `).join('');
}

function toggleNodeFilter(label) {
  activeNodeFilter = activeNodeFilter === label ? null : label;
  loadData();
}

function renderTrendSections(diff) {
  const rEl = document.getElementById('trend-rising-section');
  const fEl = document.getElementById('trend-fading-section');

  if (diff.top_rising && diff.top_rising.length) {
    rEl.innerHTML = `<div class="trend-badge trend-rising">↑ Rising</div>` +
      diff.top_rising.map(n => `<div class="trend-node">• ${n}</div>`).join('');
  } else {
    rEl.innerHTML = '';
  }

  if (diff.top_fading && diff.top_fading.length) {
    fEl.innerHTML = `<div class="trend-badge trend-fading">↓ Fading</div>` +
      diff.top_fading.map(n => `<div class="trend-node" style="color:rgba(200,150,150,0.6);">• ${n}</div>`).join('');
  } else {
    fEl.innerHTML = '';
  }
}

function setView(v) {
  currentView = v;
  document.getElementById('btn-cards').classList.toggle('active', v === 'cards');
  document.getElementById('btn-chart').classList.toggle('active', v === 'chart');
  renderView();
}

function filterByNode(val) {
  currentFilter = val.toLowerCase();
  renderView();
}

function getFilteredSnaps() {
  let snaps = allSnapshots;
  if (activeNodeFilter) {
    snaps = snaps.filter(s => s.top_nodes && s.top_nodes.some(n => n.label === activeNodeFilter));
  }
  if (currentFilter) {
    snaps = snaps.filter(s =>
      (s.top_node_label || '').toLowerCase().includes(currentFilter) ||
      (s.top_nodes || []).some(n => (n.label || '').toLowerCase().includes(currentFilter))
    );
  }
  return snaps;
}

function renderView() {
  if (currentView === 'cards') renderCards();
  else renderChart();
}

function renderCards() {
  const scroll = document.getElementById('timeline-scroll');
  const snaps = getFilteredSnaps();
  const countEl = document.getElementById('count-label');

  countEl.textContent = `${snaps.length} snapshots`;

  if (!snaps.length) {
    if (!allSnapshots.length) {
      scroll.innerHTML = `<div class="empty-state"><div class="big">👁</div>No snapshots yet<br><small style="color:rgba(0,180,255,0.3);">Open the 3D graph at localhost:5097/graph-viewer-3d.html<br>to start recording attention history</small></div>`;
    } else {
      scroll.innerHTML = `<div class="empty-state"><div class="big">🔍</div>No matches for filter</div>`;
    }
    return;
  }

  let html = '';
  let lastDate = '';
  for (const snap of snaps) {
    if (snap.date && snap.date !== lastDate) {
      lastDate = snap.date;
      html += `<div class="day-divider">📅 ${snap.date}</div>`;
    }

    const t = snap.timestamp ? snap.timestamp.split('T')[1] || snap.timestamp : '—';
    const timeStr = t.substring(0, 5);
    const topLabel = snap.top_node_label || '—';
    const topScore = snap.top_score || 0;
    const barWidth = Math.min(100, topScore * 100);
    const nodes = (snap.top_nodes || []).slice(1, 5);

    const highlighted = activeNodeFilter && snap.top_nodes && snap.top_nodes.some(n => n.label === activeNodeFilter);

    html += `<div class="snap-card ${highlighted ? 'highlighted' : ''}">
      <div class="snap-time">⏱ ${snap.date} ${timeStr}</div>
      <div class="snap-top-node">👁 ${topLabel}</div>
      <div class="snap-nodes">
        ${nodes.map(n => `<span class="snap-node-tag" title="${n.label}">${n.label}</span>`).join('')}
      </div>
      <div class="snap-heat-bar" style="width:${barWidth}%"></div>
      <div class="snap-meta">
        <span class="snap-signals">${snap.active_nodes || 0} active nodes · ${snap.total_signals || 0} signals</span>
        ${snap.dual_resonance_count > 0 ? `<span class="snap-dual">⚡${snap.dual_resonance_count} dual</span>` : ''}
      </div>
    </div>`;
  }

  scroll.innerHTML = `<div class="snap-grid">${html}</div>`;
}

function renderChart() {
  const scroll = document.getElementById('timeline-scroll');
  const snaps = getFilteredSnaps().slice().reverse();
  const countEl = document.getElementById('count-label');
  countEl.textContent = `${snaps.length} snapshots`;

  if (!snaps.length) {
    scroll.innerHTML = `<div class="empty-state"><div class="big">📊</div>No data to chart</div>`;
    return;
  }

  const W = scroll.clientWidth - 48;
  const H = 240;
  const pad = { top: 16, right: 16, bottom: 40, left: 40 };
  const iW = W - pad.left - pad.right;
  const iH = H - pad.top - pad.bottom;

  const n = snaps.length;
  const step = n > 1 ? iW / (n - 1) : iW;

  const allScores = snaps.map(s => s.top_score || 0);
  const maxScore = Math.max(...allScores, 0.01);

  let pathD = '';
  let dotsSVG = '';
  let labelsSVG = '';

  snaps.forEach((snap, i) => {
    const x = pad.left + (n > 1 ? i * step : iW / 2);
    const y = pad.top + iH - (snap.top_score / maxScore) * iH;

    if (i === 0) pathD = `M ${x} ${y}`;
    else pathD += ` L ${x} ${y}`;

    const label = snap.top_node_label || '';
    const shortLabel = label.length > 8 ? label.substring(0, 8) + '…' : label;

    dotsSVG += `<circle cx="${x}" cy="${y}" r="3" fill="rgba(0,180,255,0.7)" stroke="rgba(0,255,180,0.5)" stroke-width="1">
      <title>${snap.timestamp}: ${label} (${(snap.top_score*100).toFixed(0)}%)</title>
    </circle>`;

    if (i % Math.max(1, Math.floor(n / 8)) === 0) {
      const ts = snap.timestamp ? snap.timestamp.split('T')[1] || '' : '';
      const tStr = ts.substring(0, 5);
      labelsSVG += `<text x="${x}" y="${H - 8}" text-anchor="middle" font-size="7" fill="rgba(0,180,255,0.4)">${tStr}</text>`;
      labelsSVG += `<text x="${x}" y="${y - 8}" text-anchor="middle" font-size="7" fill="rgba(0,255,180,0.5)">${shortLabel}</text>`;
    }
  });

  const yLines = [0.25, 0.5, 0.75, 1.0].map(f => {
    const y = pad.top + iH - f * iH;
    return `<line x1="${pad.left}" y1="${y}" x2="${pad.left + iW}" y2="${y}" stroke="rgba(0,180,255,0.05)" stroke-width="1"/>
      <text x="${pad.left - 4}" y="${y + 3}" text-anchor="end" font-size="7" fill="rgba(0,180,255,0.3)">${(f * maxScore * 100).toFixed(0)}%</text>`;
  }).join('');

  const svg = `<svg width="${W}" height="${H}" style="font-family:monospace;">
    ${yLines}
    <path d="${pathD}" fill="none" stroke="rgba(0,180,255,0.5)" stroke-width="1.5"/>
    <path d="${pathD} L ${pad.left + (n > 1 ? (n-1) * step : iW/2)} ${pad.top + iH} L ${pad.left} ${pad.top + iH} Z"
          fill="url(#grad)" opacity="0.3"/>
    <defs>
      <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="rgba(0,180,255,0.4)"/>
        <stop offset="100%" stop-color="rgba(0,180,255,0)"/>
      </linearGradient>
    </defs>
    ${dotsSVG}
    ${labelsSVG}
    <text x="${W/2}" y="${H - 2}" text-anchor="middle" font-size="8" fill="rgba(0,180,255,0.2)">TIME →</text>
    <text x="8" y="${H/2}" text-anchor="middle" font-size="8" fill="rgba(0,180,255,0.2)" transform="rotate(-90,8,${H/2})">HEAT</text>
  </svg>`;

  scroll.innerHTML = `<div id="timeline-canvas-wrap">
    <div style="font-size:0.52rem;color:rgba(0,180,255,0.3);margin-bottom:8px;letter-spacing:1px;">Top-node heat score over time</div>
    ${svg}
  </div>
  <div style="font-size:0.55rem;color:rgba(0,180,255,0.25);text-align:center;margin-top:8px;letter-spacing:1px;">Switch to CARDS view for full snapshot details</div>`;
}

loadData();
setInterval(loadData, 90000);
</script>
</body>
</html>
