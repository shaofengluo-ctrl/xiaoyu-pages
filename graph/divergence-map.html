<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>认知盲点地图 · Divergence Map</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #030510;
    color: #c8d0e0;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .scanline {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.05) 2px,
      rgba(0,0,0,0.05) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  header {
    border-bottom: 1px solid #1a2840;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(3, 5, 16, 0.9);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .title-block h1 {
    font-size: 18px;
    color: #7c3aed;
    letter-spacing: 2px;
  }

  .title-block p {
    font-size: 11px;
    color: #556080;
    margin-top: 2px;
  }

  .status-row {
    display: flex;
    gap: 24px;
    align-items: center;
  }

  .stat-box {
    text-align: center;
  }

  .stat-box .val {
    font-size: 22px;
    font-weight: bold;
  }

  .stat-box .lbl {
    font-size: 9px;
    color: #445566;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .blindness-gauge {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .gauge-bar {
    width: 120px;
    height: 8px;
    background: #1a2840;
    border-radius: 4px;
    overflow: hidden;
  }

  .gauge-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 1s ease;
  }

  .back-link {
    color: #445577;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 1px;
  }

  .back-link:hover { color: #7c3aed; }

  .main-container {
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 16px;
    padding: 20px 24px;
    max-width: 1400px;
  }

  .chart-panel {
    background: rgba(10, 15, 30, 0.8);
    border: 1px solid #1a2840;
    border-radius: 8px;
    padding: 16px;
    position: relative;
  }

  .chart-title {
    font-size: 12px;
    color: #7c3aed;
    letter-spacing: 1px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    cursor: pointer;
    opacity: 1;
    transition: opacity 0.2s;
  }

  .legend-item.muted { opacity: 0.3; }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  #scatter-chart {
    width: 100%;
    height: 480px;
  }

  .side-panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card {
    background: rgba(10, 15, 30, 0.8);
    border: 1px solid #1a2840;
    border-radius: 8px;
    padding: 14px;
  }

  .card-title {
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid #1a2840;
  }

  .node-list { display: flex; flex-direction: column; gap: 6px; }

  .node-item {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 6px;
    padding: 6px 8px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.2s;
    font-size: 11px;
  }

  .node-item:hover { background: rgba(124, 58, 237, 0.1); }

  .node-label {
    flex: 1;
    color: #c8d0e0;
    word-break: break-word;
  }

  .node-scores {
    text-align: right;
    white-space: nowrap;
    font-size: 10px;
    color: #556080;
  }

  .detail-panel {
    position: fixed;
    right: 24px;
    bottom: 24px;
    width: 320px;
    background: rgba(8, 12, 25, 0.95);
    border: 1px solid #7c3aed;
    border-radius: 8px;
    padding: 16px;
    display: none;
    z-index: 500;
    backdrop-filter: blur(10px);
  }

  .detail-panel.visible { display: block; }

  .detail-title {
    font-size: 13px;
    color: #7c3aed;
    margin-bottom: 8px;
    word-break: break-all;
  }

  .detail-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    padding: 3px 0;
    border-bottom: 1px solid #1a2840;
    color: #8090a0;
  }

  .detail-row .val { color: #c8d0e0; }

  .detail-reasoning {
    margin-top: 8px;
    font-size: 10px;
    color: #556080;
    line-height: 1.5;
  }

  .close-btn {
    position: absolute;
    top: 8px;
    right: 10px;
    background: none;
    border: none;
    color: #556080;
    cursor: pointer;
    font-size: 14px;
  }

  .close-btn:hover { color: #c8d0e0; }

  .quadrant-label {
    font-size: 9px;
    fill: #334455;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .axis-label {
    font-size: 10px;
    fill: #445566;
    letter-spacing: 1px;
  }

  .tooltip {
    position: absolute;
    background: rgba(8, 12, 25, 0.9);
    border: 1px solid #334455;
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 11px;
    color: #c8d0e0;
    pointer-events: none;
    display: none;
    z-index: 200;
    max-width: 200px;
    word-break: break-all;
  }

  .no-data {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 200px;
    color: #334455;
    font-size: 12px;
  }

  .refresh-btn {
    background: none;
    border: 1px solid #334455;
    color: #556080;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 10px;
    letter-spacing: 1px;
    transition: all 0.2s;
  }

  .refresh-btn:hover {
    border-color: #7c3aed;
    color: #7c3aed;
  }
</style>
</head>
<body>
<div class="scanline"></div>

<header>
  <div class="title-block">
    <h1>🔍 DIVERGENCE MAP</h1>
    <p>认知盲点地图 · 预测 vs 实际注意力分析</p>
  </div>
  <div class="status-row" id="status-row">
    <div class="stat-box">
      <div class="val" id="stat-blindness" style="color:#f59e0b">—</div>
      <div class="lbl">盲目度</div>
    </div>
    <div class="stat-box">
      <div class="val" id="stat-blind-spots" style="color:#ef4444">—</div>
      <div class="lbl">盲点</div>
    </div>
    <div class="stat-box">
      <div class="val" id="stat-overestimated" style="color:#f97316">—</div>
      <div class="lbl">过度预测</div>
    </div>
    <div class="stat-box">
      <div class="val" id="stat-consensus" style="color:#22c55e">—</div>
      <div class="lbl">共识</div>
    </div>
    <div class="stat-box">
      <div class="val" id="stat-total" style="color:#64748b">—</div>
      <div class="lbl">节点总数</div>
    </div>
    <button class="refresh-btn" onclick="loadData()">⟳ 刷新</button>
  </div>
  <a href="../index.html" class="back-link">← 首页</a>
</header>

<div class="main-container">
  <div class="chart-panel">
    <div class="chart-title">
      ⬡ 散点图：X轴=预测分数，Y轴=实际注意力
      <span style="font-size:9px;color:#445566;margin-left:8px">点击节点查看详情</span>
    </div>
    <div class="legend" id="legend">
      <div class="legend-item" data-cat="BLIND_SPOT" onclick="toggleCat(this)">
        <div class="legend-dot" style="background:#ef4444"></div>
        <span style="color:#ef4444">盲点 (系统忽视，人类关注)</span>
      </div>
      <div class="legend-item" data-cat="OVERESTIMATED" onclick="toggleCat(this)">
        <div class="legend-dot" style="background:#f97316"></div>
        <span style="color:#f97316">过度预测 (预测高，无人问津)</span>
      </div>
      <div class="legend-item" data-cat="CONSENSUS" onclick="toggleCat(this)">
        <div class="legend-dot" style="background:#22c55e"></div>
        <span style="color:#22c55e">共识 (预测+注意力均高)</span>
      </div>
      <div class="legend-item" data-cat="DORMANT" onclick="toggleCat(this)">
        <div class="legend-dot" style="background:#334455"></div>
        <span style="color:#445566">沉默 (两者均低)</span>
      </div>
    </div>
    <div id="scatter-chart"></div>
  </div>

  <div class="side-panel">
    <div class="card">
      <div class="card-title" style="color:#ef4444">🔴 认知盲点</div>
      <div class="node-list" id="blind-spot-list">
        <div class="no-data">加载中...</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title" style="color:#f97316">🟠 过度预测</div>
      <div class="node-list" id="overestimated-list">
        <div class="no-data">加载中...</div>
      </div>
    </div>
    <div class="card">
      <div class="card-title" style="color:#22c55e">🟢 共识节点</div>
      <div class="node-list" id="consensus-list">
        <div class="no-data">加载中...</div>
      </div>
    </div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<div class="detail-panel" id="detail-panel">
  <button class="close-btn" onclick="closeDetail()">✕</button>
  <div class="detail-title" id="detail-title">—</div>
  <div id="detail-content"></div>
</div>

<script>
const API_BASE = 'http://localhost:5097';
const COLORS = {
  BLIND_SPOT: '#ef4444',
  OVERESTIMATED: '#f97316',
  CONSENSUS: '#22c55e',
  DORMANT: '#334455',
};

let allNodes = [];
let hiddenCats = new Set();
let selectedNode = null;

async function loadData() {
  try {
    const res = await fetch(`${API_BASE}/divergence-analysis`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderAll(data);
  } catch (e) {
    console.warn('API failed, trying static file:', e);
    loadStatic();
  }
}

async function loadStatic() {
  try {
    const res = await fetch('../../memories/divergence_analysis.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderAll(data);
  } catch (e) {
    console.error('Failed to load divergence data:', e);
    document.getElementById('scatter-chart').innerHTML =
      '<div class="no-data">无法加载数据 — 请先运行 attention_prediction_divergence.py</div>';
  }
}

function renderAll(data) {
  const summary = data.summary;
  allNodes = data.nodes || [];

  document.getElementById('stat-blindness').textContent =
    summary.cognitive_blindness_score.toFixed(0) + '/100';
  document.getElementById('stat-blind-spots').textContent = summary.blind_spots;
  document.getElementById('stat-overestimated').textContent = summary.overestimated;
  document.getElementById('stat-consensus').textContent = summary.consensus;
  document.getElementById('stat-total').textContent = summary.total_nodes_analyzed;

  renderScatter(allNodes);
  renderSideList('blind-spot-list', allNodes.filter(n => n.category === 'BLIND_SPOT').slice(0, 8));
  renderSideList('overestimated-list', allNodes.filter(n => n.category === 'OVERESTIMATED').slice(0, 8));
  renderSideList('consensus-list', allNodes.filter(n => n.category === 'CONSENSUS').slice(0, 8));
}

function renderSideList(containerId, nodes) {
  const el = document.getElementById(containerId);
  if (!nodes.length) {
    el.innerHTML = '<div class="no-data" style="height:40px;font-size:10px;color:#334455">暂无数据</div>';
    return;
  }
  el.innerHTML = nodes.map(n => `
    <div class="node-item" onclick="focusNode('${n.id}')">
      <div class="node-label">${n.label}</div>
      <div class="node-scores">
        <div>👁 ${(n.norm_attn * 100).toFixed(0)}%</div>
        <div>🔮 ${(n.norm_pred * 100).toFixed(0)}%</div>
      </div>
    </div>
  `).join('');
}

function renderScatter(nodes) {
  const container = document.getElementById('scatter-chart');
  container.innerHTML = '';

  const margin = { top: 20, right: 30, bottom: 50, left: 55 };
  const W = container.clientWidth || 700;
  const H = 460;
  const w = W - margin.left - margin.right;
  const h = H - margin.top - margin.bottom;

  const svg = d3.select('#scatter-chart')
    .append('svg')
    .attr('width', W)
    .attr('height', H);

  const g = svg.append('g')
    .attr('transform', `translate(${margin.left},${margin.top})`);

  const x = d3.scaleLinear().domain([0, 1]).range([0, w]);
  const y = d3.scaleLinear().domain([0, 1]).range([h, 0]);

  const THRESHOLD = 0.25;

  // Quadrant backgrounds
  const quads = [
    { x: THRESHOLD, y: THRESHOLD, w: 1 - THRESHOLD, h: 1 - THRESHOLD, color: '#1a3020', label: '共识区' },
    { x: 0, y: THRESHOLD, w: THRESHOLD, h: 1 - THRESHOLD, color: '#3a1020', label: '盲点区' },
    { x: THRESHOLD, y: 0, w: 1 - THRESHOLD, h: THRESHOLD, color: '#3a1800', label: '过预测区' },
    { x: 0, y: 0, w: THRESHOLD, h: THRESHOLD, color: '#0a1020', label: '沉默区' },
  ];

  quads.forEach(q => {
    g.append('rect')
      .attr('x', x(q.x))
      .attr('y', y(q.y + q.h))
      .attr('width', x(q.w) - x(0))
      .attr('height', y(0) - y(q.h))
      .attr('fill', q.color)
      .attr('opacity', 0.4);
  });

  // Quadrant labels
  const qLabels = [
    { lx: (1 + THRESHOLD) / 2, ly: (1 + THRESHOLD) / 2, text: '共识区' },
    { lx: THRESHOLD / 2, ly: (1 + THRESHOLD) / 2, text: '盲点区' },
    { lx: (1 + THRESHOLD) / 2, ly: THRESHOLD / 2, text: '过预测区' },
    { lx: THRESHOLD / 2, ly: THRESHOLD / 2, text: '沉默区' },
  ];
  qLabels.forEach(ql => {
    g.append('text')
      .attr('x', x(ql.lx))
      .attr('y', y(ql.ly))
      .attr('class', 'quadrant-label')
      .attr('text-anchor', 'middle')
      .text(ql.text);
  });

  // Threshold lines
  g.append('line')
    .attr('x1', x(THRESHOLD)).attr('x2', x(THRESHOLD))
    .attr('y1', 0).attr('y2', h)
    .attr('stroke', '#334455').attr('stroke-width', 1).attr('stroke-dasharray', '4,4');
  g.append('line')
    .attr('x1', 0).attr('x2', w)
    .attr('y1', y(THRESHOLD)).attr('y2', y(THRESHOLD))
    .attr('stroke', '#334455').attr('stroke-width', 1).attr('stroke-dasharray', '4,4');

  // Grid
  g.append('g').call(d3.axisLeft(y).ticks(5).tickFormat(d => (d * 100).toFixed(0) + '%'))
    .call(g2 => g2.selectAll('text').attr('fill', '#556080').attr('font-size', 10))
    .call(g2 => g2.selectAll('line').attr('stroke', '#1a2840'))
    .call(g2 => g2.select('.domain').remove());

  g.append('g').attr('transform', `translate(0,${h})`)
    .call(d3.axisBottom(x).ticks(5).tickFormat(d => (d * 100).toFixed(0) + '%'))
    .call(g2 => g2.selectAll('text').attr('fill', '#556080').attr('font-size', 10))
    .call(g2 => g2.selectAll('line').attr('stroke', '#1a2840'))
    .call(g2 => g2.select('.domain').remove());

  // Axis labels
  g.append('text').attr('class', 'axis-label')
    .attr('x', w / 2).attr('y', h + 38).attr('text-anchor', 'middle')
    .text('🔮 预测分数 (Prediction Score)');

  g.append('text').attr('class', 'axis-label')
    .attr('transform', 'rotate(-90)')
    .attr('x', -h / 2).attr('y', -42).attr('text-anchor', 'middle')
    .text('👁 实际注意力 (Actual Attention)');

  // Dots
  const tooltip = document.getElementById('tooltip');
  const visibleNodes = nodes.filter(n => !hiddenCats.has(n.category));

  g.selectAll('.dot')
    .data(visibleNodes)
    .enter()
    .append('circle')
    .attr('class', 'dot')
    .attr('cx', d => x(d.norm_pred))
    .attr('cy', d => y(d.norm_attn))
    .attr('r', d => {
      const base = d.category === 'DORMANT' ? 3 : 5;
      return base + d.abs_divergence * 6;
    })
    .attr('fill', d => COLORS[d.category])
    .attr('opacity', d => d.category === 'DORMANT' ? 0.3 : 0.75)
    .attr('stroke', d => selectedNode === d.id ? '#fff' : 'none')
    .attr('stroke-width', 2)
    .style('cursor', 'pointer')
    .on('mouseover', function(event, d) {
      tooltip.style.display = 'block';
      tooltip.innerHTML = `<strong>${d.label}</strong><br>
        注意力: ${(d.norm_attn * 100).toFixed(0)}%<br>
        预测: ${(d.norm_pred * 100).toFixed(0)}%<br>
        分歧: ${d.divergence > 0 ? '+' : ''}${(d.divergence * 100).toFixed(0)}%`;
      d3.select(this).attr('opacity', 1).attr('stroke', '#fff');
    })
    .on('mousemove', function(event) {
      const rect = document.body.getBoundingClientRect();
      tooltip.style.left = (event.clientX + 12) + 'px';
      tooltip.style.top = (event.clientY - 10) + 'px';
    })
    .on('mouseout', function(event, d) {
      tooltip.style.display = 'none';
      d3.select(this).attr('opacity', d.category === 'DORMANT' ? 0.3 : 0.75)
        .attr('stroke', selectedNode === d.id ? '#fff' : 'none');
    })
    .on('click', function(event, d) {
      showDetail(d);
    });

  // Labels for top divergence nodes
  const topNodes = visibleNodes
    .filter(n => n.category !== 'DORMANT')
    .sort((a, b) => b.abs_divergence - a.abs_divergence)
    .slice(0, 8);

  topNodes.forEach(d => {
    const cx = x(d.norm_pred);
    const cy = y(d.norm_attn);
    const shortLabel = d.label.length > 20 ? d.label.slice(0, 18) + '…' : d.label;
    g.append('text')
      .attr('x', cx + 8)
      .attr('y', cy + 4)
      .attr('fill', COLORS[d.category])
      .attr('font-size', 9)
      .attr('opacity', 0.8)
      .text(shortLabel);
  });
}

function toggleCat(el) {
  const cat = el.dataset.cat;
  if (hiddenCats.has(cat)) {
    hiddenCats.delete(cat);
    el.classList.remove('muted');
  } else {
    hiddenCats.add(cat);
    el.classList.add('muted');
  }
  renderScatter(allNodes);
}

function focusNode(nodeId) {
  const node = allNodes.find(n => n.id === nodeId);
  if (node) showDetail(node);
}

function showDetail(node) {
  selectedNode = node.id;
  document.getElementById('detail-title').textContent = node.label;
  document.getElementById('detail-content').innerHTML = `
    <div class="detail-row"><span>类别</span><span class="val" style="color:${COLORS[node.category]}">${node.category}</span></div>
    <div class="detail-row"><span>👁 实际注意力</span><span class="val">${(node.norm_attn * 100).toFixed(1)}%</span></div>
    <div class="detail-row"><span>🔮 预测分数</span><span class="val">${(node.norm_pred * 100).toFixed(1)}%</span></div>
    <div class="detail-row"><span>分歧值</span><span class="val" style="color:${node.divergence > 0 ? '#ef4444' : '#f97316'}">${node.divergence > 0 ? '+' : ''}${(node.divergence * 100).toFixed(1)}%</span></div>
    <div class="detail-row"><span>历史出现</span><span class="val">${node.visit_count} 次快照</span></div>
    <div class="detail-row"><span>峰值注意力</span><span class="val">${(node.peak_attn * 100).toFixed(1)}%</span></div>
    <div class="detail-row"><span>节点类型</span><span class="val">${node.node_type}</span></div>
    ${node.pred_reasoning ? `<div class="detail-reasoning">预测理由：${node.pred_reasoning}</div>` : ''}
  `;
  document.getElementById('detail-panel').classList.add('visible');
  renderScatter(allNodes);
}

function closeDetail() {
  selectedNode = null;
  document.getElementById('detail-panel').classList.remove('visible');
}

loadData();
</script>
</body>
</html>
